<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Scanner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="bannier">
        <ul>
            <li><a href="index.html#scanner">Scanner</a></li>
            <li><a href="livres.html">Livres</a></li>
            <li><a href="ajout.html">Ajout manuel</a></li>
            <li><a href="connect.html" id="loginLink">Se connecter</a></li>
        </ul>
    </nav>


    <style>

        /* Conteneur du formulaire */
        .login-container {
            position: fixed; /* Toujours visible à l'écran */
            top: 50%;        /* Centre vertical */
            left: 50%;       /* Centre horizontal */
            transform: translate(-50%, -50%);
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 350px;
        }

        .login-container h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        /* Champs de saisie */
        .login-container input[type="email"],
        .login-container input[type="password"] {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 2px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        /* Bouton */
        .login-container button {
            width: 100%;
            padding: 12px;
            background-color: #4a90e2;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        .login-container button:hover {
            background-color: #357ABD;
        }

        /* Message d'erreur */
        .error {
            color: red;
            font-size: 14px;
            margin-top: 5px;
        }
    </style>


    <div class="login-container">
    <h2>Connexion</h2>

    <form id="loginForm">
        <input
            type="email"
            id="email"
            placeholder="Email"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Mot de passe"
            required
        >

        <div id="errorMsg" class="error"></div>

        <button type="submit">Se connecter</button>
    </form>
    <br>
    <button id="signupBtn">
        Créer un compte
    </button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="connect.js"></script>
</body>
</html>
