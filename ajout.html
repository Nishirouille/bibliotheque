<!DOCTYPE html>

<head>

            <li><a href="connect.html" id="loginLink">Se connecter</a></li>
        </ul>
    </nav>

    <h1>Ajouter un livre</h1>

    <form id="bookForm">
        <input
            type="text"
            id="title"
            placeholder="Titre"
            required
        >

        <input
            type="text"
            id="authors"
            placeholder="Auteur(s)"
            required
        >

        <input
            type="text"
            id="publisher"
            placeholder="Éditeur"
            required
        >

        <input
            type="text"
            id="isbn"
            placeholder="ISBN (optionnel)"
        >

        <button type="submit">
            Ajouter
        </button>
    </form>

    <p id="message"></p>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="app.js"></script>
    <script src="ajout.js"></script>

</body>
</html>
